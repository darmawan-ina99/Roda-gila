<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎡 Rolet Edukasi Berpola + Suara</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 30px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 {
    color: #ffd700;
    font-size: 1.7em;
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(255,215,0,0.4);
  }
  .subtitle {
    color: #aaa;
    font-size: 0.85em;
    margin-bottom: 15px;
  }
  .counter {
    background: rgba(255,215,0,0.15);
    border: 2px solid #ffd700;
    border-radius: 10px;
    padding: 8px 15px;
    display: inline-block;
    margin-bottom: 15px;
    font-weight: bold;
  }
  .counter span { color: #ffd700; font-size: 1.3em; }
  .wheel-wrapper {
    position: relative;
    width: 340px;
    height: 340px;
    margin: 0 auto 20px;
  }
  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 30px solid #ffd700;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
    z-index: 10;
  }
  canvas {
    border-radius: 50%;
    box-shadow: 0 0 0 8px #1a1a2e, 0 0 0 12px #ffd700, 0 15px 40px rgba(0,0,0,0.6);
    /* ⏱️ DURASI PUTARAN: 75 detik */
    transition: transform 75s cubic-bezier(0.15, 0.55, 0.1, 1);
  }
  .result {
    font-size: 1.2em;
    margin: 18px 0;
    min-height: 1.5em;
    color: #ffd700;
    font-weight: bold;
  }
  .result span {
    display: inline-block;
    font-size: 2.2em;
    background: rgba(255,215,0,0.15);
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 5px 25px;
    animation: pop 0.5s;
  }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  button {
    padding: 15px 40px;
    font-size: 1.1em;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    background: linear-gradient(135deg, #ffd700, #ff9500);
    color: #1a1a2e;
    box-shadow: 0 6px 20px rgba(255,215,0,0.4);
    transition: all 0.2s;
    margin: 0 5px;
  }
  button:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(255,215,0,0.6);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #resetBtn, #muteBtn {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: none;
    padding: 15px 20px;
  }
  #resetBtn:hover, #muteBtn:hover { background: rgba(255,255,255,0.2); }
  .history {
    margin-top: 18px;
    font-size: 0.85em;
    color: #888;
    min-height: 1.5em;
  }
  .history strong { color: #ffd700; }
</style>
</head>
<body>
<div class="container">
  <h1>🎡 Rolet Edukasi Berpola</h1>
  <p class="subtitle">Angka kecil sering keluar • 10, 15, 40 punya jadwal rahasia</p>

  <div class="counter">Putaran ke-<span id="counter">1</span> / 60</div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheel" width="680" height="680"></canvas>
  </div>

  <div class="result" id="result">Tekan tombol untuk memutar 🎯</div>
  <button id="spinBtn" onclick="spin()">🎡 PUTAR</button>
  <button id="resetBtn" onclick="resetGame()">🔄</button>
  <button id="muteBtn" onclick="toggleMute()">🔊</button>

  <div class="history" id="history"></div>
</div>

<script>
  // ==========================================
  // ⏱️ DURASI PUTARAN (dalam milidetik)
  // ==========================================
  const DURASI_PUTARAN = 75000; // 75 detik
  // ==========================================

  // ==========================================
  // AUDIO ENGINE (Web Audio API)
  // ==========================================
  let audioCtx = null;
  let muted = false;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type = 'sine', volume = 0.15, delay = 0) {
    if (muted) return;
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const startTime = audioCtx.currentTime + delay;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(volume, startTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playTick() {
    playTone(1200, 0.03, 'square', 0.08);
  }

  function playClick() {
    playTone(600, 0.05, 'triangle', 0.15);
  }

  function playDing() {
    playTone(880, 0.3, 'sine', 0.2);
    playTone(1320, 0.4, 'sine', 0.15, 0.05);
  }

  function playFanfare() {
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      playTone(f, 0.25, 'triangle', 0.22, i * 0.12);
    });
  }

  function playJackpot() {
    const notes = [523, 659, 784, 1047, 1319, 1568];
    notes.forEach((f, i) => {
      playTone(f, 0.35, 'triangle', 0.25, i * 0.13);
      playTone(f / 2, 0.35, 'sine', 0.12, i * 0.13);
    });
    setTimeout(() => {
      playTone(1047, 1.2, 'sine', 0.25);
      playTone(1319, 1.2, 'sine', 0.2);
      playTone(1568, 1.2, 'sine', 0.18);
    }, 900);
  }

  // Suara tik roda — melambat otomatis mengikuti durasi
  let tickTimer = null;
  function startWheelTicks(duration) {
    if (tickTimer) clearTimeout(tickTimer);
    const startTime = Date.now();
    const tick = () => {
      const elapsed = Date.now() - startTime;
      if (elapsed > duration) {
        tickTimer = null;
        return;
      }
      playTick();
      // Interval melambat kuadratik: awal cepat (50ms), akhir sangat lambat (600ms+)
      const progress = elapsed / duration;
      const interval = 50 + progress * progress * 550;
      tickTimer = setTimeout(tick, interval);
    };
    tick();
  }

  function stopWheelTicks() {
    if (tickTimer) {
      clearTimeout(tickTimer);
      tickTimer = null;
    }
  }

  function toggleMute() {
    muted = !muted;
    document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  }

  // ==========================================
  // KONFIGURASI PERMAINAN
  // ==========================================
  const RUAS_RANDOM = [
    { angka: 1,  jumlah: 12 },
    { angka: 2,  jumlah: 8  },
    { angka: 5,  jumlah: 6  },
    { angka: 8,  jumlah: 4  },
    { angka: 20, jumlah: 2  },
    { angka: 30, jumlah: 1  }
  ];

  const JADWAL = {
    17: 10,
    28: 15,
    60: 40
  };

  const TOTAL_PUTARAN = 60;

  const SLICES = [];
  RUAS_RANDOM.forEach(item => {
    for (let i = 0; i < item.jumlah; i++) SLICES.push(item.angka);
  });
  [10, 15, 40].forEach(a => SLICES.push(a));

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  shuffle(SLICES);

  function getColor(angka) {
    const min = 1, max = 40;
    const t = (angka - min) / (max - min);
    const hue = 10 + t * 200;
    return `hsl(${hue}, 70%, 55%)`;
  }

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const center = size / 2;
  const radius = center - 10;
  const sliceAngle = (Math.PI * 2) / SLICES.length;

  let currentRotation = 0;
  let spinning = false;
  let historyList = [];
  let putaranKe = 1;

  function pilihAngka() {
    if (JADWAL[putaranKe] !== undefined) {
      return JADWAL[putaranKe];
    }
    const pool = [];
    RUAS_RANDOM.forEach(item => {
      for (let i = 0; i < item.jumlah; i++) pool.push(item.angka);
    });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function cariIndexUntukAngka(angkaTarget) {
    const kandidat = [];
    SLICES.forEach((a, i) => {
      if (a === angkaTarget) kandidat.push(i);
    });
    return kandidat[Math.floor(Math.random() * kandidat.length)];
  }

  function drawWheel() {
    ctx.clearRect(0, 0, size, size);

    SLICES.forEach((angka, i) => {
      const startAngle = i * sliceAngle + currentRotation;
      const endAngle = startAngle + sliceAngle;

      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = getColor(angka);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(startAngle + sliceAngle / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = 5;

      const fontSize = sliceAngle * radius > 40 ? 30 : 20;
      ctx.font = `bold ${fontSize}px Segoe UI`;
      ctx.fillText(angka, radius - 20, 10);
      ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(center, center, 42, 0, Math.PI * 2);
    ctx.fillStyle = '#1a1a2e';
    ctx.fill();
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 5;
    ctx.stroke();
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    playClick();
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('result').textContent = 'Memutar... 🌀 (sabar ya, 75 detik)';

    const angkaHasil = pilihAngka();
    const targetIndex = cariIndexUntukAngka(angkaHasil);

    const pointerAngle = -Math.PI / 2;
    const targetSliceCenter = targetIndex * sliceAngle + sliceAngle / 2;
    const baseRotation = pointerAngle - targetSliceCenter;

    // Karena durasi panjang, cukup 3-5 putaran penuh saja biar tidak terlalu cepat
    const extraSpins = 3 + Math.floor(Math.random() * 3);
    const totalRotation = extraSpins * Math.PI * 2 + baseRotation;

    const normalizedCurrent = ((currentRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const normalizedTarget = ((totalRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    let delta = normalizedTarget - normalizedCurrent;
    if (delta < 0) delta += Math.PI * 2;
    currentRotation += extraSpins * Math.PI * 2 + delta;

    // Mulai suara tik roda (mengikuti durasi)
    startWheelTicks(DURASI_PUTARAN);

    canvas.style.transform = `rotate(${currentRotation}rad)`;

    setTimeout(() => {
      stopWheelTicks();
      const resultEl = document.getElementById('result');
      let label = '';
      if (JADWAL[putaranKe] !== undefined) {
        label = ' 🎯 (jadwal khusus!)';
      }
      resultEl.innerHTML = `Hasilnya: <span>${angkaHasil}</span>${label}`;

      if (angkaHasil === 40) {
        setTimeout(playJackpot, 200);
      } else if (angkaHasil === 10 || angkaHasil === 15) {
        setTimeout(playFanfare, 200);
      } else {
        playDing();
      }

      historyList.unshift(angkaHasil);
      if (historyList.length > 8) historyList.pop();
      document.getElementById('history').innerHTML =
        'Riwayat: ' + historyList.map(n => `<strong>${n}</strong>`).join(' → ');

      putaranKe++;
      if (putaranKe > TOTAL_PUTARAN) putaranKe = 1;
      document.getElementById('counter').textContent = putaranKe;

      spinning = false;
      document.getElementById('spinBtn').disabled = false;
    }, DURASI_PUTARAN + 500); // 75 detik + buffer 500ms
  }

  function resetGame() {
    playClick();
    putaranKe = 1;
    historyList = [];
    document.getElementById('counter').textContent = '1';
    document.getElementById('history').innerHTML = '';
    document.getElementById('result').textContent = 'Game direset! Tekan PUTAR untuk mulai 🎯';
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
    stopWheelTicks();
  }

  drawWheel();

  document.body.addEventListener('click', initAudio, { once: true });
</script>
</body>
    </html>
